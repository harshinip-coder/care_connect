<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- Light Purple Dome/Semi-Circle Backdrop -->
  <path d="M40 160 A 120 120 0 0 1 280 160 Z" fill="#f4f0fe" />

  <!-- Segmented Purple Baseline -->
  <line x1="20" y1="160" x2="60" y2="160" stroke="#7c5dfa" stroke-width="3" stroke-linecap="round" />
  <line x1="72" y1="160" x2="238" y2="160" stroke="#7c5dfa" stroke-width="3" stroke-linecap="round" />
  <line x1="250" y1="160" x2="275" y2="160" stroke="#7c5dfa" stroke-width="3" stroke-linecap="round" />
  <line x1="285" y1="160" x2="300" y2="160" stroke="#7c5dfa" stroke-width="3" stroke-linecap="round" />

  <!-- Boy Shirt / Shoulders -->
  <path d="M105 160 C105 130, 215 130, 215 160 Z" fill="#ede9fe" stroke="#7c5dfa" stroke-width="3" stroke-linejoin="round" />
  <!-- Neck Collar Line -->
  <path d="M142 130 C142 144, 178 144, 178 130" stroke="#7c5dfa" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Ears -->
  <circle cx="122" cy="98" r="9" fill="#ffffff" stroke="#7c5dfa" stroke-width="3" />
  <circle cx="198" cy="98" r="9" fill="#ffffff" stroke="#7c5dfa" stroke-width="3" />

  <!-- Face Head Oval -->
  <rect x="126" y="60" width="68" height="74" rx="32" fill="#ffffff" stroke="#7c5dfa" stroke-width="3" />

  <!-- Boy Hair Cutouts (3 Bumps) -->
  <path d="M125 78 C125 45, 195 45, 195 78 C185 58, 170 52, 160 62 C150 52, 135 58, 125 78 Z" fill="#7c5dfa" stroke="#7c5dfa" stroke-width="2" />
  <path d="M130 65 Q 160 50, 190 65 Q 160 58, 130 65 Z" fill="#7c5dfa" />

  <!-- Eyes Looking UPWARDS to the Right -->
  <circle cx="146" cy="94" r="7" fill="#ffffff" stroke="#312e81" stroke-width="2.5" />
  <circle cx="149" cy="91" r="3" fill="#312e81" />

  <circle cx="174" cy="94" r="7" fill="#ffffff" stroke="#312e81" stroke-width="2.5" />
  <circle cx="177" cy="91" r="3" fill="#312e81" />

  <!-- Thinking Mouth Line -->
  <line x1="152" y1="116" x2="168" y2="114" stroke="#312e81" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Question Marks '?' -->
  <!-- Top Center-Right Question Mark -->
  <text x="208" y="44" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#7c5dfa">?</text>
  <!-- Top Center Question Mark -->
  <text x="146" y="38" font-family="'Inter', sans-serif" font-weight="800" font-size="24" fill="#7c5dfa">?</text>
  <!-- Far Right Middle Question Mark -->
  <text x="232" y="78" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#9080fc">?</text>
  <!-- Top Left Question Mark -->
  <text x="102" y="65" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#7c5dfa">?</text>
  <!-- Far Left Middle Question Mark -->
  <text x="82" y="90" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#9080fc">?</text>
</svg>
