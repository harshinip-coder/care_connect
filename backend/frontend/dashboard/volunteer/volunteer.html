<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Dashboard | CareConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard-common.css">
    <link rel="stylesheet" href="/css/resident-dashboard.css">
    <style>
        .volunteer-hero-card { background: #ffffff; border-radius: 24px; padding: 28px; border: 1px solid #e2e8f0; margin-bottom: 24px; }
        .request-card { background: #faf5ff; border-radius: 20px; padding: 24px; border: 1px solid #e9d5ff; margin-bottom: 20px; }
        .btn-vol-accept { background: #7c3aed; color: #ffffff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-vol-decline { background: #ffffff; color: #dc2626; border: 1px solid #fca5a5; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
            <img src="/images/careconnect-logo.png" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'">
            <h2>CareConnect</h2>
        </div>
        <nav class="sidebar-navigation">
            <a href="/dashboard/volunteer/volunteer.html" class="nav-item active"><i class="fa-solid fa-table-cells-large nav-icon"></i><span>Dashboard</span></a>
            <a href="/dashboard/volunteer/profile.html" class="nav-item"><i class="fa-regular fa-user nav-icon"></i><span>Profile</span></a>
            <a href="/dashboard/volunteer/emergency.html" class="nav-item nav-emergency"><i class="fa-solid fa-bell nav-icon text-red"></i><span>Emergency Alerts</span></a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button type="button" class="sidebar-toggle-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="topbar-search-box"><i class="fa-solid fa-magnifying-glass text-muted"></i><input type="text" placeholder="Search assistance calls..."></div>
            </div>
            <div class="topbar-right">
                <div class="topbar-user-pill" style="display:flex; align-items:center; gap:10px; margin-right:16px;">
                    <img src="https://ui-avatars.com/api/?name=Volunteer&background=7c3aed&color=fff&bold=true" alt="Avatar" id="userAvatarImg" class="topbar-user-avatar" style="width:36px; height:36px; border-radius:50%;">
                    <div class="topbar-user-info" style="display:flex; flex-direction:column;">
                        <strong id="topbarUserName" style="font-size:0.9rem; color:#0f172a;">Volunteer</strong>
                        <span id="topbarUserRole" style="font-size:0.75rem; color:#64748b;">Volunteer</span>
                    </div>
                </div>
                <button type="button" class="banner-btn btn-dark" onclick="handleLogout()">Logout</button>
            </div>
        </header>

        <div class="dashboard-main-content">
            <!-- DYNAMIC LIVE EMERGENCY ALERT BANNER -->
            <div id="liveSosStatusBanner" style="display:none; background:#fff5f5; border:2px solid #ef4444; border-radius:20px; padding:20px; margin-bottom:24px;"></div>

            <!-- VOLUNTEER HERO BANNER -->
            <div class="volunteer-hero-card">
                <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
                    <div>
                        <h2 style="font-size:1.5rem; font-weight:800; color:#0f172a; margin:0;" id="welcomeHeaderTitle">Welcome back, <span id="welcomeUserName">Volunteer</span> 👋</h2>
                        <p style="font-size:0.875rem; color:#64748b; margin:4px 0 0;">Community Volunteer Care Network & Emergency Support</p>
                    </div>
                </div>
            </div>

            <!-- AVAILABLE REQUESTS CARD -->
            <div style="background:#ffffff; border-radius:24px; padding:24px; border:1px solid #e2e8f0;">
                <h3 style="font-size:1.2rem; font-weight:800; color:#0f172a; margin-bottom:16px;">Available Community Assistance Requests</h3>

                <div id="emergencyNotificationsList">
                    <div style="color:#64748b; font-size:0.9rem;">No active assistance requests in your society right now.</div>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="/js/i18n-translations.js"></script>
<script src="/js/settings-manager.js"></script>
<script src="/js/emergency-manager.js"></script>
<script src="/js/auth-guard.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    verifySessionAndRole("volunteer");
});
</script>
</body>
</html>
