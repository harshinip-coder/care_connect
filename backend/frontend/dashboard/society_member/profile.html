<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Member Profile | CareConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard-common.css">
    <link rel="stylesheet" href="/css/resident-dashboard.css">
    <style>
        .profile-container-grid { display: grid; grid-template-columns: 340px 1fr; gap: 28px; }
        @media (max-width: 900px) { .profile-container-grid { grid-template-columns: 1fr; } }
        .profile-card { background: #ffffff; border-radius: 24px; padding: 28px; border: 1px solid #e2e8f0; }
        .avatar-preview-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 16px; }
        .avatar-preview-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #10b981; }
        .avatar-initials-fallback { width: 100%; height: 100%; border-radius: 50%; background: #10b981; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; border: 4px solid #10b981; }
        .avatar-edit-badge { position: absolute; bottom: 0; right: 0; background: #0284c7; color: #fff; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fff; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .form-grid-2 { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 0.9rem; }
        .form-control:focus { border-color: #10b981; outline: none; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
            <img src="/images/careconnect-logo.png" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'">
            <h2>CareConnect</h2>
        </div>
        <nav class="sidebar-navigation">
            <a href="/dashboard/society_member/society_member.html" class="nav-item"><i class="fa-solid fa-table-cells-large nav-icon"></i><span>Dashboard</span></a>
            <a href="/dashboard/society_member/profile.html" class="nav-item active"><i class="fa-regular fa-user nav-icon"></i><span>Profile</span></a>
            <a href="/dashboard/society_member/residents.html" class="nav-item"><i class="fa-solid fa-users nav-icon"></i><span>Residents</span></a>
            <a href="/dashboard/society_member/guardians.html" class="nav-item"><i class="fa-solid fa-user-shield nav-icon"></i><span>Guardians</span></a>
            <a href="/dashboard/society_member/society.html" class="nav-item"><i class="fa-solid fa-building nav-icon"></i><span>Society</span></a>
            <a href="/dashboard/society_member/blocks.html" class="nav-item"><i class="fa-solid fa-cubes nav-icon"></i><span>Blocks</span></a>
            <a href="/dashboard/society_member/flats.html" class="nav-item"><i class="fa-solid fa-door-closed nav-icon"></i><span>Flats</span></a>
            <a href="/dashboard/society_member/security.html" class="nav-item"><i class="fa-solid fa-shield-halved nav-icon"></i><span>Security</span></a>
            <a href="/dashboard/society_member/volunteers.html" class="nav-item"><i class="fa-solid fa-hand-holding-heart nav-icon"></i><span>Volunteers</span></a>
            <a href="/dashboard/society_member/emergency.html" class="nav-item nav-emergency"><i class="fa-solid fa-bell nav-icon text-red"></i><span>Emergency Alerts</span></a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button type="button" class="sidebar-toggle-btn"><i class="fa-solid fa-bars"></i></button>
            </div>
            <div class="topbar-right">
                <button type="button" class="settings-gear-btn" onclick="if(typeof openSettingsModal==='function') openSettingsModal();" style="background:none; border:none; font-size:1.2rem; color:#64748b; margin-right:16px; cursor:pointer;">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div class="topbar-user-pill" onclick="window.location.href='/dashboard/society_member/profile.html'" style="display:flex; align-items:center; gap:10px; margin-right:16px; cursor:pointer;">
                    <img src="https://ui-avatars.com/api/?name=Society+Member&background=10b981&color=fff&bold=true" alt="Avatar" id="userAvatarImg" class="topbar-user-avatar" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid #10b981;">
                    <div class="topbar-user-info" style="display:flex; flex-direction:column;">
                        <strong id="topbarUserName" style="font-size:0.9rem; color:#0f172a;">Society Member</strong>
                        <span id="topbarUserRole" style="font-size:0.75rem; color:#64748b;">Society Member</span>
                    </div>
                </div>
                <a href="/dashboard/society_member/society_member.html" class="banner-btn btn-dark"><i class="fa-solid fa-house me-1"></i> Dashboard</a>
            </div>
        </header>

        <div class="dashboard-main-content">
            <div class="profile-container-grid">
                <!-- LEFT PROFILE SUMMARY CARD -->
                <div class="profile-card" style="text-align:center;">
                    <div class="avatar-preview-wrap">
                        <div id="profileAvatarInitials" class="avatar-initials-fallback">SM</div>
                        <img id="profileAvatarImage" class="avatar-preview-img" src="" alt="Avatar" style="display:none;">
                        <label for="profilePhotoInput" class="avatar-edit-badge" title="Change Avatar"><i class="fa-solid fa-camera"></i></label>
                        <input type="file" id="profilePhotoInput" accept="image/*" style="display:none;" onchange="handleProfilePhotoUpload(event)">
                    </div>
                    <h2 id="profileDisplayName" style="font-size:1.3rem; font-weight:800; color:#0f172a; margin:0;">Society Member</h2>
                    <span id="profileRoleBadge" style="display:inline-block; background:#dcfce7; color:#15803d; font-weight:700; font-size:0.75rem; padding:4px 12px; border-radius:20px; margin:8px 0 16px;">Society Member</span>
                    
                    <div style="text-align:left; border-top:1px solid #f1f5f9; padding-top:16px; font-size:0.85rem; color:#475569;">
                        <p style="margin:8px 0;"><i class="fa-solid fa-envelope me-2 text-teal"></i> <span id="summaryEmail">member@careconnect.com</span></p>
                        <p style="margin:8px 0;"><i class="fa-solid fa-phone me-2 text-teal"></i> <span id="summaryPhone">+91 98765 43210</span></p>
                        <p style="margin:8px 0;"><i class="fa-solid fa-building me-2 text-teal"></i> <span id="summarySociety">UK</span></p>
                    </div>

                    <div style="margin-top:20px;">
                        <button type="button" class="banner-btn btn-teal" style="width:100%; margin-bottom:8px;" onclick="document.getElementById('profilePhotoInput').click()"><i class="fa-solid fa-upload me-1"></i> Upload Photo</button>
                        <button type="button" class="banner-btn btn-dark" style="width:100%;" onclick="openForgotPasswordModal()"><i class="fa-solid fa-key me-1"></i> Reset Password</button>
                    </div>
                </div>

                <!-- RIGHT EDIT DETAILS & PASSWORD CARDS -->
                <div>
                    <!-- EDIT INFO FORM -->
                    <div class="profile-card" style="margin-bottom:24px;">
                        <h3 style="font-size:1.15rem; font-weight:800; color:#0f172a; margin-bottom:16px;"><i class="fa-solid fa-user-pen me-2 text-teal"></i> Personal Details</h3>
                        <form id="profileUpdateForm" onsubmit="handleProfileUpdate(event)">
                            <div class="form-grid-2">
                                <div class="form-group">
                                    <label>First Name</label>
                                    <input type="text" id="profileFirstName" class="form-control" placeholder="First Name" required>
                                </div>
                                <div class="form-group">
                                    <label>Last Name</label>
                                    <input type="text" id="profileLastName" class="form-control" placeholder="Last Name" required>
                                </div>
                            </div>
                            <div class="form-grid-2">
                                <div class="form-group">
                                    <label>Email Address</label>
                                    <input type="email" id="profileEmail" class="form-control" placeholder="Email" required>
                                </div>
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="text" id="profilePhone" class="form-control" placeholder="Phone">
                                </div>
                            </div>
                            <button type="submit" class="banner-btn btn-teal" style="margin-top:8px;"><i class="fa-solid fa-floppy-disk me-1"></i> Save Changes</button>
                        </form>
                    </div>

                    <!-- CHANGE PASSWORD FORM -->
                    <div class="profile-card">
                        <h3 style="font-size:1.15rem; font-weight:800; color:#0f172a; margin-bottom:16px;"><i class="fa-solid fa-lock me-2 text-teal"></i> Change Password</h3>
                        <form id="profilePasswordForm" onsubmit="handlePasswordChange(event)">
                            <div class="form-group">
                                <label>Current Password</label>
                                <input type="password" id="profileOldPassword" class="form-control" placeholder="Enter current password" required>
                            </div>
                            <div class="form-grid-2">
                                <div class="form-group">
                                    <label>New Password</label>
                                    <input type="password" id="profileNewPassword" class="form-control" placeholder="Enter new password" required>
                                </div>
                                <div class="form-group">
                                    <label>Confirm Password</label>
                                    <input type="password" id="profileConfirmPassword" class="form-control" placeholder="Confirm new password" required>
                                </div>
                            </div>
                            <button type="submit" class="banner-btn btn-dark" style="margin-top:8px;"><i class="fa-solid fa-shield-halved me-1"></i> Update Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/i18n-translations.js"></script>
<script src="/js/settings-manager.js"></script>
<script src="/js/auth-guard.js"></script>
<script src="/js/profile-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    verifySessionAndRole("society_member");
    if (typeof loadProfileData === "function") {
        loadProfileData();
    }
});
</script>
</body>
</html>
