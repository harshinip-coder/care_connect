{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #091e36;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: #0284c7;
            padding: 32px 28px;
            color: #ffffff;
            text-center;
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2,132,199,0.15);
        }
        .btn-login {
            background: #0284c7;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header text-center">
        <div style="background:rgba(255,255,255,0.2); width:56px; height:56px; border-radius:16px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px;">
            <i class="fa-solid fa-heart-pulse fs-2 text-white"></i>
        </div>
        <h3 class="fw-bold m-0">CareConnect</h3>
        <p class="small opacity-75 m-0 mt-1">Community Safety & Emergency Response</p>
    </div>

    <div class="p-4 p-md-5">
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold text-secondary small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-4 text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 rounded-end-4" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-bold text-secondary small m-0">Password</label>
                    <a href="{% url 'forgot_password' %}" class="small text-primary text-decoration-none fw-semibold">Forgot?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-4 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 rounded-end-4" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-login shadow-sm mb-4">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
            </button>

            <div class="text-center">
                <span class="text-muted small">Don't have an account?</span>
                <a href="{% url 'register' %}" class="small text-primary fw-bold text-decoration-none ms-1">Register Now</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
