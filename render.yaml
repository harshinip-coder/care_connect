services:
  - type: web
    name: careconnect-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn careconnect.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString

databases:
  - name: careconnect-db
    databaseName: careconnect_db
    user: careconnect_user
