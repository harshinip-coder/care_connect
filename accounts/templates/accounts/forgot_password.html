{% extends 'dashboard/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Forgot Password</h3>
                </div>

                <div class="card-body">

                    <p class="text-muted">
                        Enter your registered email address. If it exists in the system, you will receive instructions to reset your password.
                    </p>

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary">
                            Send Reset Link
                        </button>

                        <a href="{% url 'login' %}" class="btn btn-secondary">
                            Back to Login
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
