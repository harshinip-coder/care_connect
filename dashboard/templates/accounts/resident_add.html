{% extends 'dashboard/base.html' %}

{% block content %}
<div class="admin-page-container fade-up">
    <div class="admin-header-row">
        <div>
            <h1 class="page-title">Add Resident</h1>
            <p class="page-subtitle">Create a new resident user record in CareConnect.</p>
        </div>
        <div>
            <a href="{% url 'resident_list' %}" class="btn btn-outline-secondary rounded-3 px-3 fw-bold">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Residents
            </a>
        </div>
    </div>

    <div class="admin-card max-width-800 mx-auto">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">
                {% for field in form %}
                    <div class="col-md-6 mb-2">
                        <label class="form-label fw-bold text-dark small mb-1">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
            <div class="mt-4 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn-teal">
                    <i class="fa-solid fa-check me-1"></i> Save Resident
                </button>
                <a href="{% url 'resident_list' %}" class="btn btn-light rounded-3 px-4 fw-bold text-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
