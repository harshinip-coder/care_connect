{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #091e36;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 620px;
            overflow: hidden;
        }
        .register-header {
            background: #0284c7;
            padding: 28px 24px;
            color: #ffffff;
            text-align: center;
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2,132,199,0.15);
        }
        .btn-register {
            background: #0284c7;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-register:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="register-header">
        <div style="background:rgba(255,255,255,0.2); width:48px; height:48px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:8px;">
            <i class="fa-solid fa-user-plus fs-3 text-white"></i>
        </div>
        <h4 class="fw-bold m-0">CareConnect Account Registration</h4>
        <p class="small opacity-75 m-0 mt-1">Select your role and enter your registration details</p>
    </div>

    <div class="p-4 p-md-5">
        <form action="{% url 'register' %}" method="POST">
            {% csrf_token %}

            <div class="row g-3">
                <!-- ROLE SELECTION -->
                <div class="col-12">
                    <label class="form-label fw-bold text-secondary small">I am registering as a:</label>
                    <select name="role" id="roleSelect" class="form-select fw-bold text-primary" onchange="toggleRoleFields()">
                        <option value="resident" selected>🏡 Resident</option>
                        <option value="guardian">🛡️ Guardian</option>
                        <option value="society_member">🏛️ Society Member</option>
                        <option value="security">👮 Security Personnel</option>
                        <option value="volunteer">🤝 Volunteer</option>
                    </select>
                </div>

                <!-- USERNAME & NAMES -->
                <div class="col-12">
                    <label class="form-label fw-bold text-secondary small">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>

                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">First Name</label>
                    <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
                </div>

                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">Last Name</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
                </div>

                <!-- EMAIL & PHONE -->
                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
                </div>

                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">Phone</label>
                    <input type="text" name="phone" class="form-control" placeholder="+91 9876543210" required>
                </div>

                <!-- DYNAMIC ROLE SPECIFIC FIELDS -->

                <!-- RESIDENT FIELDS -->
                <div class="col-12 role-field field-resident">
                    <label class="form-label fw-bold text-secondary small">Society</label>
                    {{ form.society }}
                </div>

                <div class="col-6 role-field field-resident">
                    <label class="form-label fw-bold text-secondary small">Block</label>
                    {{ form.block }}
                </div>

                <div class="col-6 role-field field-resident">
                    <label class="form-label fw-bold text-secondary small">Flat Number</label>
                    {{ form.flat }}
                </div>

                <!-- GUARDIAN FIELDS -->
                <div class="col-12 role-field field-guardian d-none">
                    <label class="form-label fw-bold text-secondary small">Guardian Type</label>
                    <select name="guardian_type" class="form-select">
                        <option value="primary" selected>Primary Guardian</option>
                        <option value="secondary">Secondary Guardian</option>
                    </select>
                </div>

                <!-- SECURITY FIELDS -->
                <div class="col-12 role-field field-security d-none">
                    <label class="form-label fw-bold text-secondary small">Employee ID / Guard Badge No.</label>
                    <input type="text" name="employee_id" class="form-control" placeholder="e.g. SEC-0012">
                </div>

                <!-- VOLUNTEER FIELDS -->
                <div class="col-12 role-field field-volunteer d-none">
                    <label class="form-label fw-bold text-secondary small">Special Skills & Services</label>
                    <textarea name="skills" class="form-control" rows="2" placeholder="First Aid, CPR, Fire Safety..."></textarea>
                </div>

                <!-- PASSWORDS -->
                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">Password</label>
                    <input type="password" name="password1" class="form-control" placeholder="Password" required>
                </div>

                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">Confirm Password</label>
                    <input type="password" name="password2" class="form-control" placeholder="Confirm Password" required>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn-register shadow-sm">
                        <i class="fa-solid fa-user-check me-2"></i> Complete Registration
                    </button>
                </div>
            </div>

            <div class="text-center mt-3">
                <span class="text-muted small">Already have an account?</span>
                <a href="{% url 'login' %}" class="small text-primary fw-bold text-decoration-none ms-1">Log In</a>
            </div>
        </form>
    </div>
</div>

<script>
function toggleRoleFields() {
    const role = document.getElementById('roleSelect').value;
    document.querySelectorAll('.role-field').forEach(el => el.classList.add('d-none'));
    if (role === 'resident' || role === 'society_member') {
        document.querySelectorAll('.field-resident').forEach(el => el.classList.remove('d-none'));
    } else if (role === 'guardian') {
        document.querySelectorAll('.field-guardian').forEach(el => el.classList.remove('d-none'));
    } else if (role === 'security') {
        document.querySelectorAll('.field-security').forEach(el => el.classList.remove('d-none'));
        document.querySelectorAll('.field-resident').forEach(el => el.classList.remove('d-none'));
    } else if (role === 'volunteer') {
        document.querySelectorAll('.field-volunteer').forEach(el => el.classList.remove('d-none'));
        document.querySelectorAll('.field-resident').forEach(el => el.classList.remove('d-none'));
    }
}
toggleRoleFields();
</script>

</body>
</html>
