<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04122b" />
      <stop offset="100%" stop-color="#0a2a57" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2c3" />
      <stop offset="100%" stop-color="#0088cc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Night Sky Background -->
  <rect width="400" height="240" rx="16" fill="url(#skyGrad)" />

  <!-- Stars & Moon Glow -->
  <circle cx="60" cy="40" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="120" cy="25" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="280" cy="35" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="340" cy="50" r="2" fill="#ffffff" opacity="0.9" />

  <!-- Buildings Silhouette -->
  <rect x="20" y="90" width="45" height="110" fill="#061a38" />
  <rect x="30" y="105" width="8" height="12" fill="#ffcc00" opacity="0.7" />
  <rect x="48" y="125" width="8" height="12" fill="#ffcc00" opacity="0.8" />

  <rect x="75" y="70" width="60" height="130" fill="#082247" />
  <rect x="88" y="85" width="10" height="14" fill="#ffcc00" opacity="0.9" />
  <rect x="112" y="85" width="10" height="14" fill="#ffffff" opacity="0.7" />
  <rect x="88" y="115" width="10" height="14" fill="#ffcc00" opacity="0.8" />

  <rect x="265" y="80" width="55" height="120" fill="#082247" />
  <rect x="278" y="95" width="10" height="14" fill="#ffcc00" opacity="0.8" />
  <rect x="300" y="125" width="10" height="14" fill="#ffcc00" opacity="0.9" />

  <rect x="330" y="100" width="50" height="100" fill="#061a38" />
  <rect x="342" y="115" width="8" height="12" fill="#ffffff" opacity="0.7" />

  <!-- Ground / Hills -->
  <path d="M0 180 Q 200 160, 400 180 L 400 240 L 0 240 Z" fill="#041836" />

  <!-- Family Silhouettes / Vector Characters -->
  <!-- Mother (Left) -->
  <circle cx="150" cy="125" r="14" fill="#38bdf8" />
  <path d="M130 185 C130 145, 170 145, 170 185 Z" fill="#0284c7" />

  <!-- Child (Center) -->
  <circle cx="200" cy="140" r="11" fill="#fde047" />
  <path d="M185 190 C185 160, 215 160, 215 190 Z" fill="#eab308" />

  <!-- Father (Right) -->
  <circle cx="250" cy="120" r="15" fill="#38bdf8" />
  <path d="M230 185 C230 140, 270 140, 270 185 Z" fill="#1e40af" />

  <!-- Glowing Shield in Front with Checkmark -->
  <g filter="url(#glow)">
    <path d="M200 150 L230 165 C230 195, 200 215, 200 220 C200 215, 170 195, 170 165 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2" />
    <path d="M188 182 L196 190 L212 174" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
