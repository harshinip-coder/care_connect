<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Profile | CareConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard-common.css">
    <link rel="stylesheet" href="/css/resident-dashboard.css">
    <style>
        body { background-color: #f0fdfa; font-family: 'Inter', sans-serif; }
        
        .profile-page-grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 900px) { .profile-page-grid { grid-template-columns: 1fr; } }

        .profile-left-card { background: #ffffff; border-radius: 24px; padding: 28px; border: 1px solid #e2e8f0; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .avatar-circle-box { position: relative; width: 110px; height: 110px; margin: 0 auto 16px; border-radius: 50%; }
        .avatar-circle-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #00d2b5; }
        .avatar-initials-circle { width: 100%; height: 100%; border-radius: 50%; background: #00d2b5; color: #ffffff; font-size: 2.2rem; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 4px solid #ffffff; box-shadow: 0 4px 12px rgba(0,210,181,0.3); }
        .avatar-camera-btn { position: absolute; bottom: 2px; right: 2px; background: #0f172a; color: #ffffff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; border: 2px solid #ffffff; cursor: pointer; transition: transform 0.15s ease; }
        .avatar-camera-btn:hover { transform: scale(1.1); }

        .profile-user-name { font-size: 1.4rem; font-weight: 800; color: #0f172a; margin: 0 0 4px 0; }
        .profile-role-tag { font-size: 0.8rem; font-weight: 700; color: #0d9488; margin-bottom: 16px; }

        .btn-upload-avatar { width: 100%; background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; font-weight: 700; padding: 10px; border-radius: 12px; font-size: 0.85rem; cursor: pointer; margin-bottom: 20px; transition: background 0.15s ease; }
        .btn-upload-avatar:hover { background: #f1f5f9; }

        .profile-contact-box { background: #f8fafc; border-radius: 16px; padding: 16px; border: 1px solid #f1f5f9; text-align: left; margin-bottom: 20px; font-size: 0.82rem; color: #475569; }
        .contact-row-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; word-break: break-all; }
        .contact-row-item:last-child { margin-bottom: 0; }
        .contact-row-item i { width: 16px; color: #0d9488; font-size: 0.9rem; }

        .btn-back-dashboard { display: block; width: 100%; background: #0f172a; color: #ffffff; font-weight: 800; padding: 12px; border-radius: 14px; text-decoration: none; text-align: center; font-size: 0.88rem; margin-bottom: 10px; box-sizing: border-box; }
        .btn-back-dashboard:hover { background: #1e293b; color: #fff; }

        .btn-purple-forgot { display: block; width: 100%; background: #7c3aed; color: #ffffff; font-weight: 800; padding: 12px; border-radius: 14px; border: none; font-size: 0.88rem; cursor: pointer; text-align: center; transition: background 0.15s ease; }
        .btn-purple-forgot:hover { background: #6d28d9; }

        /* RIGHT COLUMN FORM CARDS */
        .profile-right-card { background: #ffffff; border-radius: 24px; padding: 32px; border: 1px solid #e2e8f0; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .card-header-title { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .form-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px; }
        @media (max-width: 600px) { .form-row-2col { grid-template-columns: 1fr; } }

        .form-group-item { margin-bottom: 18px; }
        .form-group-item label { font-size: 0.82rem; font-weight: 700; color: #334155; display: block; margin-bottom: 6px; }
        .form-input-styled { width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid #e2e8f0; font-size: 0.9rem; font-family: inherit; color: #0f172a; background: #ffffff; box-sizing: border-box; transition: border-color 0.2s ease; }
        .form-input-styled:focus { outline: none; border-color: #0d9488; box-shadow: 0 0 0 3px rgba(13,148,136,0.15); }

        .btn-teal-action { background: #00d2b5; color: #ffffff; font-weight: 800; padding: 12px 24px; border-radius: 14px; border: none; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s ease; }
        .btn-teal-action:hover { background: #00b89f; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand"><img src="/images/careconnect-logo.png" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'"><h2>CareConnect</h2></div>
        <nav class="sidebar-navigation">
            <a href="/dashboard/guardian/guardian.html" class="nav-item"><i class="fa-solid fa-table-cells-large nav-icon"></i><span data-i18n="dashboard">Dashboard</span></a>
            <a href="/dashboard/guardian/profile.html" class="nav-item active"><i class="fa-regular fa-user nav-icon"></i><span data-i18n="nav_profile">Profile</span></a>
            <a href="/dashboard/guardian/guardians.html" class="nav-item"><i class="fa-solid fa-user-shield nav-icon"></i><span data-i18n="nav_residents">My Residents</span></a>
            <a href="/dashboard/guardian/emergency.html" class="nav-item nav-emergency"><i class="fa-solid fa-bell nav-icon text-red"></i><span data-i18n="emergency_alerts">Emergency Alerts</span></a>
            <a href="javascript:void(0)" onclick="if(typeof openSettingsModal==='function') openSettingsModal();" class="nav-item"><i class="fa-solid fa-gear nav-icon"></i><span data-i18n="settings">Settings</span></a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <!-- TOPBAR WITH DYNAMIC CLICKABLE PROFILE ICON -->
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button type="button" class="sidebar-toggle-btn" aria-label="Toggle Sidebar"><i class="fa-solid fa-bars"></i></button>
            </div>
            <div class="topbar-right">
                <button type="button" class="settings-gear-btn" onclick="if(typeof openSettingsModal==='function') openSettingsModal();" aria-label="Open settings" style="background:none; border:none; font-size:1.2rem; color:#64748b; margin-right:16px; cursor:pointer;">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <!-- TOP PROFILE ICON CLICK NAVIGATES TO PROFILE PAGE -->
                <div class="topbar-user-pill" onclick="window.location.href='/dashboard/guardian/profile.html'" style="display:flex; align-items:center; gap:10px; margin-right:16px; cursor:pointer;" title="Click to view Profile">
                    <img src="https://ui-avatars.com/api/?name=Guardian&background=0284c7&color=fff&bold=true" alt="Avatar" id="userAvatarImg" class="topbar-user-avatar" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid #0284c7;">
                    <div class="topbar-user-info" style="display:flex; flex-direction:column;">
                        <strong id="topbarUserName" style="font-size:0.9rem; color:#0f172a;">Guardian</strong>
                        <span id="topbarUserRole" style="font-size:0.75rem; color:#64748b;">Guardian</span>
                    </div>
                </div>

                <a href="/dashboard/guardian/guardian.html" class="banner-btn btn-dark" style="text-decoration:none;"><i class="fa-solid fa-house me-1"></i> Back to Dashboard</a>
            </div>
        </header>

        <div class="dashboard-main-content">
            <div class="profile-page-grid">
                
                <!-- LEFT COLUMN: PROFILE CARD -->
                <div class="profile-left-card">
                    <div class="avatar-circle-box">
                        <div id="profileAvatarInitials" class="avatar-initials-circle">--</div>
                        <img id="profileBigAvatar" class="avatar-circle-img" src="" alt="Avatar" style="display:none;">
                        <button type="button" class="avatar-camera-btn" onclick="triggerProfilePicUpload()" title="Change Profile Photo"><i class="fa-solid fa-camera"></i></button>
                        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleProfilePicChange(event)">
                    </div>

                    <h3 id="profileFullName" class="profile-user-name">User Profile</h3>
                    <div id="profileRoleBadge" class="profile-role-tag">Guardian</div>

                    <button type="button" class="btn-upload-avatar" onclick="triggerProfilePicUpload()"><i class="fa-solid fa-cloud-arrow-up me-2"></i> Upload New Avatar</button>

                    <div class="profile-contact-box">
                        <div class="contact-row-item">
                            <i class="fa-regular fa-envelope"></i>
                            <div><span style="font-weight:600;">Email:</span> <span id="profileEmailTxt">...</span></div>
                        </div>
                        <div class="contact-row-item">
                            <i class="fa-solid fa-phone"></i>
                            <div><span style="font-weight:600;">Emergency:</span> <span id="profileEmergencyContact">...</span></div>
                        </div>
                        <div class="contact-row-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <div><span style="font-weight:600;">Flat:</span> <span id="profileFlatTxt">...</span></div>
                        </div>
                    </div>

                    <a href="/dashboard/guardian/guardian.html" class="btn-back-dashboard"><i class="fa-solid fa-house me-2"></i> Back to Dashboard</a>
                    <button type="button" class="btn-purple-forgot" onclick="triggerForgotPassword()"><i class="fa-solid fa-key me-2"></i> Forgot Password?</button>
                </div>

                <!-- RIGHT COLUMN: UPDATE PROFILE & SECURITY CARDS -->
                <div>
                    <!-- TOP CARD: UPDATE PROFILE INFORMATION -->
                    <div class="profile-right-card">
                        <h2 class="card-header-title">Update Profile Information</h2>
                        <form id="profileUpdateForm">
                            <div class="form-row-2col">
                                <div class="form-group-item">
                                    <label for="profFirstName">First Name</label>
                                    <input type="text" id="profFirstName" class="form-input-styled" placeholder="First Name" required>
                                </div>
                                <div class="form-group-item">
                                    <label for="profLastName">Last Name</label>
                                    <input type="text" id="profLastName" class="form-input-styled" placeholder="Last Name" required>
                                </div>
                            </div>

                            <div class="form-group-item">
                                <label for="profEmail">Email Address</label>
                                <input type="email" id="profEmail" class="form-input-styled" placeholder="email@example.com" required>
                            </div>

                            <div class="form-row-2col">
                                <div class="form-group-item">
                                    <label for="profPhone">Mobile / Emergency Phone</label>
                                    <input type="tel" id="profPhone" class="form-input-styled" placeholder="+91 XXXXX XXXXX" required>
                                </div>
                                <div class="form-group-item">
                                    <label for="profFlat">Flat / Block Details</label>
                                    <input type="text" id="profFlat" class="form-input-styled" placeholder="Block A, Flat 101">
                                </div>
                            </div>

                            <button type="submit" class="btn-teal-action"><i class="fa-solid fa-floppy-disk me-2"></i> Update Profile Information</button>
                        </form>
                    </div>

                    <!-- BOTTOM CARD: SECURITY & PASSWORD MANAGEMENT -->
                    <div class="profile-right-card">
                        <h2 class="card-header-title"><i class="fa-solid fa-shield-halved text-teal me-2"></i> Security & Password Management</h2>
                        <form id="passwordChangeForm">
                            <div class="form-group-item">
                                <label for="currPassword">Current Password</label>
                                <input type="password" id="currPassword" class="form-input-styled" placeholder="••••••••" required>
                            </div>

                            <div class="form-row-2col">
                                <div class="form-group-item">
                                    <label for="newPassword">New Password</label>
                                    <input type="password" id="newPassword" class="form-input-styled" placeholder="New password" required>
                                </div>
                                <div class="form-group-item">
                                    <label for="confirmPassword">Confirm New Password</label>
                                    <input type="password" id="confirmPassword" class="form-input-styled" placeholder="Confirm new password" required>
                                </div>
                            </div>

                            <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:8px;">
                                <button type="submit" class="btn-teal-action"><i class="fa-solid fa-check me-2"></i> Change Password</button>
                                <button type="button" class="btn-purple-forgot" onclick="triggerForgotPassword()" style="width:auto; padding:12px 20px;"><i class="fa-solid fa-right-to-bracket me-2"></i> Forgot Password?</button>
                            </div>
                        </form>
                    </div>

                </div>

            </div>
        </div>
    </main>
</div>

<script src="/js/i18n-translations.js"></script>
<script src="/js/settings-manager.js"></script>
<script src="/js/auth-guard.js"></script>
<script src="/js/profile-manager.js"></script>
</body>
</html>
