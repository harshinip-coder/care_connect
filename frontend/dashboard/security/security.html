<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard | CareConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard-common.css">
    <link rel="stylesheet" href="/css/resident-dashboard.css">
    <style>
        .security-hero-card { background: #ffffff; border-radius: 24px; padding: 28px; border: 1px solid #e2e8f0; margin-bottom: 24px; }
        .dispatch-card { background: #fff5f5; border-radius: 20px; padding: 24px; border: 2px solid #fecaca; margin-bottom: 20px; }
        .badge-emergency { background: #dc2626; color: #ffffff; font-weight: 800; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; }
        .badge-status { background: #fef3c7; color: #92400e; font-weight: 700; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
            <img src="/images/careconnect-logo.png" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'">
            <h2>CareConnect</h2>
        </div>
        <nav class="sidebar-navigation">
            <a href="/dashboard/security/security.html" class="nav-item active"><i class="fa-solid fa-table-cells-large nav-icon"></i><span>Dashboard</span></a>
            <a href="/dashboard/security/profile.html" class="nav-item"><i class="fa-regular fa-user nav-icon"></i><span>Profile</span></a>
            <a href="/dashboard/security/emergency.html" class="nav-item nav-emergency"><i class="fa-solid fa-shield-cat nav-icon text-red"></i><span>Emergency Alerts</span></a>
            <a href="/dashboard/security/settings.html" class="nav-item"><i class="fa-solid fa-gear nav-icon"></i><span>Settings</span></a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button type="button" class="sidebar-toggle-btn" aria-label="Toggle Sidebar"><i class="fa-solid fa-bars"></i></button>
                <div class="topbar-search-box">
                    <i class="fa-solid fa-magnifying-glass text-muted"></i>
                    <input type="text" placeholder="Search security dispatches...">
                </div>
            </div>
            <div class="topbar-right">
                <!-- NOTIFICATION BELL WITH COUNTER & POPOVER -->
                <button type="button" class="notification-btn" id="notifBtn" onclick="toggleSecurityNotificationPopover(event)" aria-label="Open notifications" style="position:relative; background:none; border:none; font-size:1.2rem; color:#64748b; margin-right:16px; cursor:pointer;">
                    <i class="fa-regular fa-bell"></i>
                    <span id="notifBadge" class="badge-pill" style="position:absolute; top:-4px; right:-6px; background:#ef4444; color:#fff; font-size:0.65rem; font-weight:800; padding:2px 6px; border-radius:10px; display:none;"></span>
                </button>

                <!-- SETTINGS GEAR -->
                <button type="button" class="settings-gear-btn" onclick="if(typeof openSettingsModal==='function') openSettingsModal(); else window.location.href='/dashboard/security/settings.html';" aria-label="Open settings" style="background:none; border:none; font-size:1.2rem; color:#64748b; margin-right:16px; cursor:pointer;">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <!-- USER AVATAR & INFO (CLICK OPENS PROFILE) -->
                <div class="topbar-user-pill" onclick="window.location.href='/dashboard/security/profile.html'" style="display:flex; align-items:center; gap:10px; margin-right:16px; cursor:pointer;" title="Click to view Profile">
                    <img src="https://ui-avatars.com/api/?name=Security+Officer&background=d97706&color=fff&bold=true" alt="Avatar" id="userAvatarImg" class="topbar-user-avatar" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid #d97706;">
                    <div class="topbar-user-info" style="display:flex; flex-direction:column;">
                        <strong id="topbarUserName" style="font-size:0.9rem; color:#0f172a;">Security Officer</strong>
                        <span id="topbarUserRole" style="font-size:0.75rem; color:#64748b;">Security</span>
                    </div>
                </div>
                <button type="button" class="banner-btn btn-dark" onclick="handleLogout()">Logout</button>
            </div>
        </header>

        <div class="dashboard-main-content">
            <!-- DYNAMIC LIVE EMERGENCY ALERT BANNER (POWERED BY REAL DATA) -->
            <div id="liveSosStatusBanner" style="display:none; background:#fff5f5; border:2px solid #ef4444; border-radius:20px; padding:20px; margin-bottom:24px;"></div>

            <!-- SECURITY HERO BANNER -->
            <div class="security-hero-card">
                <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
                    <div>
                        <h2 style="font-size:1.5rem; font-weight:800; color:#0f172a; margin:0;" id="welcomeHeaderTitle">Welcome back, <span id="welcomeUserName">Security Officer</span> 👋</h2>
                        <p style="font-size:0.875rem; color:#64748b; margin:4px 0 0;">Security Personnel Command Center & Dispatch Operations</p>
                    </div>
                </div>
            </div>

            <!-- ACTIVE DISPATCHES & REAL EMERGENCY LOGS -->
            <div style="background:#ffffff; border-radius:24px; padding:24px; border:1px solid #e2e8f0;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3 style="font-size:1.2rem; font-weight:800; color:#0f172a; margin:0;">Active Security Dispatches & Emergency Alerts</h3>
                    <a href="/dashboard/security/emergency.html" style="font-size:0.85rem; color:#0284c7; font-weight:700; text-decoration:none;">View All Incident Dispatches &rarr;</a>
                </div>
                <div id="emergencyNotificationsList">
                    <div style="color:#64748b; font-size:0.9rem; padding:16px 0;">No active security dispatches right now.</div>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- NOTIFICATION POPOVER -->
<div id="securityNotifPopover" style="display:none; position:fixed; top:70px; right:20px; width:340px; background:#ffffff; border-radius:18px; box-shadow:0 16px 40px rgba(0,0,0,0.12); border:1px solid #e2e8f0; z-index:99999; padding:16px;">
</div>

<script src="/js/i18n-translations.js"></script>
<script src="/js/settings-manager.js"></script>
<script src="/js/emergency-manager.js"></script>
<script src="/js/auth-guard.js"></script>
<script>
let globalSecurityNotifications = [];

async function fetchSecurityNotifications() {
    try {
        const res = await fetch(`${API_BASE_URL}/api/emergency/notifications/`, { credentials: "include" });
        if (!res.ok) return;
        const data = await res.json();
        const notifs = data.notifications || data.unread_notifications || [];
        globalSecurityNotifications = notifs;

        const badge = document.getElementById("notifBadge");
        if (badge) {
            if (notifs.length > 0) {
                badge.textContent = notifs.length;
                badge.style.display = "inline-block";
            } else {
                badge.style.display = "none";
            }
        }
    } catch (e) {
        console.warn("Notifications fetch warning:", e);
    }
}

function toggleSecurityNotificationPopover(event) {
    if (event) event.stopPropagation();
    const popover = document.getElementById("securityNotifPopover");
    if (!popover) return;

    if (popover.style.display === "block") {
        popover.style.display = "none";
        return;
    }

    let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #f1f5f9; padding-bottom:8px;">
            <h4 style="margin:0; font-size:0.95rem; font-weight:800; color:#0f172a;"><i class="fa-solid fa-bell text-teal me-2"></i>Notifications</h4>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:0.75rem; color:#64748b; font-weight:700;">${globalSecurityNotifications.length} Total</span>
                ${globalSecurityNotifications.length > 0 ? `<span onclick="markSecurityNotificationsRead()" style="font-size:0.75rem; color:#0284c7; font-weight:700; cursor:pointer; text-decoration:underline;">Mark all read</span>` : ''}
            </div>
        </div>
    `;

    if (!globalSecurityNotifications || globalSecurityNotifications.length === 0) {
        html += `
            <div style="text-align:center; padding:24px 12px; color:#64748b; background:#f8fafc; border-radius:14px; border:1px dashed #cbd5e1;">
                <i class="fa-regular fa-bell-slash" style="font-size:1.8rem; color:#94a3b8; margin-bottom:6px; display:block;"></i>
                <strong style="font-size:0.85rem; color:#334155; display:block;">No Notifications</strong>
                <span style="font-size:0.75rem; color:#94a3b8;">You are all caught up!</span>
            </div>
        `;
    } else {
        html += `<div style="max-height:280px; overflow-y:auto;">`;
        globalSecurityNotifications.forEach(n => {
            html += `
                <div style="padding:10px; border-bottom:1px solid #f1f5f9; font-size:0.82rem;">
                    <strong style="color:#0f172a; display:block;">${n.title || 'Security Dispatch Alert'}</strong>
                    <span style="color:#64748b; display:block;">${n.message || n.text || ''}</span>
                    <span style="font-size:0.7rem; color:#94a3b8; margin-top:2px; display:block;">${n.created_at || ''}</span>
                </div>
            `;
        });
        html += `</div>`;
    }

    popover.innerHTML = html;
    popover.style.display = "block";

    const closeHandler = (evt) => {
        if (!popover.contains(evt.target) && !evt.target.closest("#notifBtn, .notification-btn")) {
            popover.style.display = "none";
            document.removeEventListener("click", closeHandler);
        }
    };
    setTimeout(() => document.addEventListener("click", closeHandler), 10);
}

async function markSecurityNotificationsRead() {
    try {
        await fetch(`${API_BASE_URL}/api/notifications/mark-all-read/`, {
            method: "POST",
            credentials: "include"
        });
    } catch (e) {}
    globalSecurityNotifications = [];
    const badge = document.getElementById("notifBadge");
    if (badge) {
        badge.textContent = "0";
        badge.style.display = "none";
    }
    const popover = document.getElementById("securityNotifPopover");
    if (popover) {
        popover.style.display = "none";
    }
}

document.addEventListener("DOMContentLoaded", () => {
    verifySessionAndRole("security");
    fetchSecurityNotifications();
    setInterval(fetchSecurityNotifications, 10000);
});
</script>
</body>
</html>
